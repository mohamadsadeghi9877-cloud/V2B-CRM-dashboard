[project]
name = "ghofreyar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diba-stt>=0.1.0",
    "fastapi>=0.143.0",
    "faster-whisper>=1.2.1",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "jdatetime>=5.0.0",
    "openpyxl>=3.1.5",
    "persian-speech>=1.1.3",
    "pocket-tts>=3.3.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "transformers>=5.20.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ghofreyar = "ghofreyar:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = [".", "src"]

